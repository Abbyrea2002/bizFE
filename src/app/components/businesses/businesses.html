
<div class="container">
    <div class="row">
        @for (business of business_list; track business.name) {
            <div class="col-12 col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-header">
                        {{ business.name }}
                    </div>
                    <div class="card-body">
                        This business is located in
                        {{ business.town }}
                    </div>
                    <div class="card-footer">
                       Rating: {{ business.rating }}
                    </div>
                </div>
            </div>
        }
    </div>
    <div class="row">
    <div class="col-sm-4">
        <button class="btn btn-primary"
           (click)="previousPage()">Previous</button>
    </div>
    <div class="col-sm-4 text-center align-self-centre">
        showing page {{ this.page }}
         of {{ this.businessData.getLastPageNumber() }}
    </div>
    <div class="col-sm-4 text-end">
        <button class="btn btn-primary"
           (click)="nextPage()">Next</button>
    </div>
</div>
</div>
